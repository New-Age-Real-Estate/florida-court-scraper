name: SmartSkip Autonomous Skip Tracing

on:
  workflow_dispatch:
    inputs:
      verify_login_only:
        description: 'Only verify login credentials and capture session'
        type: boolean
        required: false
        default: true
      custom_csv_url:
        description: 'Optional direct S3 or HTTP URL to an input CSV'
        type: string
        required: false
        default: ''

jobs:
  smartskip:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pypdf boto3
          playwright install chromium --with-deps

      - name: Execute SmartSkip Autonomous Bot
        env:
          SMARTSKIP_EMAIL: ${{ secrets.SMARTSKIP_EMAIL }}
          SMARTSKIP_PASSWORD: ${{ secrets.SMARTSKIP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          if [ "${{ github.event.inputs.verify_login_only }}" = "true" ]; then
            echo "[*] Running SmartSkip login verification test..."
            python smartskip_bot.py --verify-login-only
          else
            echo "[*] Running SmartSkip automated skip tracing run..."
            python smartskip_bot.py --verify-login-only
          fi

      - name: Upload Debug Screenshots & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartskip-artifacts
          path: |
            debug_screenshots/smartskip/
            downloads/smartskip/
            smartskip_session.json
          retention-days: 7
